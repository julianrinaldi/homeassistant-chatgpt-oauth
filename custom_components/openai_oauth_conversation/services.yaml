generate_content:
  name: Generate content
  description: Generate text using the selected ChatGPT OAuth account, optionally with OpenAI web search.
  fields:
    config_entry:
      name: ChatGPT OAuth account
      description: The configured ChatGPT account to use.
      required: true
      selector:
        config_entry:
          integration: openai_oauth_conversation
    prompt:
      name: Prompt
      description: The request to send to the model.
      required: true
      selector:
        text:
          multiline: true
    model:
      name: Model
      description: Optional model override for this action call.
      required: false
      selector:
        select:
          options:
            - label: GPT-5.6 Sol
              value: gpt-5.6-sol
            - label: GPT-5.6 Terra
              value: gpt-5.6-terra
            - label: GPT-5.6 Luna
              value: gpt-5.6-luna
            - label: GPT-5.5
              value: gpt-5.5
    reasoning_effort:
      name: Thinking level
      description: Optional per-call override. It must be supported by the selected model.
      required: false
      selector:
        select:
          options:
            - label: Low
              value: low
            - label: Medium
              value: medium
            - label: High
              value: high
            - label: Extra high
              value: xhigh
            - label: Max
              value: max
            - label: Ultra
              value: ultra
    web_search_mode:
      name: Web search
      description: Use the integration setting, disable search, let the model decide, or require OpenAI web-search evidence.
      required: false
      selector:
        select:
          options:
            - label: Use configured setting
              value: configured
            - label: Disabled
              value: disabled
            - label: Automatic
              value: auto
            - label: Required
              value: required
    web_search_context_size:
      name: Search context size
      description: How much web-result context is made available to the model.
      required: false
      selector:
        select:
          options:
            - label: Low
              value: low
            - label: Medium
              value: medium
            - label: High
              value: high
    web_search_include_sources:
      name: Include sources in response text
      description: Add clickable citations and a Sources section to the returned text. Disable this for natural voice-assistant responses; citation metadata is still returned separately.
      required: false
      selector:
        boolean:
    web_search_live_access:
      name: Live internet access
      description: Allow OpenAI web search to fetch live pages instead of using only cached or indexed content.
      required: false
      selector:
        boolean:
    web_search_use_home_assistant_location:
      name: Use Home Assistant location
      description: Send only Home Assistant's country and time zone as an approximate search hint. Coordinates are never sent.
      required: false
      selector:
        boolean:

