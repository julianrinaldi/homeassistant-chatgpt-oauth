name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Home Assistant ${{ matrix.homeassistant }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            homeassistant: "2026.4.0"
            pytest_ha: "0.13.321"
          - python: "3.14"
            homeassistant: "2026.7.4"
            pytest_ha: "0.13.348"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest>=8.3" \
            "pytest-asyncio>=0.25" \
            "pytest-cov>=6.0" \
            "pytest-homeassistant-custom-component==${{ matrix.pytest_ha }}" \
            "ruff==0.16.0"
      - name: Install Home Assistant conversation dependencies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          import homeassistant

          manifest = (
              Path(homeassistant.__file__).parent
              / "components"
              / "conversation"
              / "manifest.json"
          )
          requirements = json.loads(manifest.read_text())["requirements"]
          subprocess.run(
              [sys.executable, "-m", "pip", "install", *requirements],
              check=True,
          )
          PY
      - name: Verify Home Assistant version
        run: |
          python - <<'PY'
          from homeassistant.const import __version__
          expected = "${{ matrix.homeassistant }}"
          if __version__ != expected:
              raise SystemExit(
                  f"Expected Home Assistant {expected}, installed {__version__}"
              )
          PY
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Compile integration
        run: python -m compileall -q custom_components/openai_oauth_conversation
      - name: Run tests
        run: >-
          pytest
          --cov=custom_components.openai_oauth_conversation
          --cov-report=term-missing
